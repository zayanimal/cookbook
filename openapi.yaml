openapi: 3.0.3
info:
  title: Cookbook API
  description: |
    REST API для системы документации Cookbook.
    
    API предоставляет функциональность для управления разделами, подразделами и страницами документации.
    Иерархия: Раздел → Подраздел → Страница.
    Все операции требуют авторизации через JWT токен, кроме эндпоинта `/auth/login`.
    
    Роли пользователей:
    - **admin** - полные права на редактирование и добавление контента
    - **client** - только просмотр, без прав на редактирование
  version: 1.0.0
  contact:
    name: API Support
    email: support@example.com

servers:
  - url: /api
    description: Основной сервер API
  - url: http://localhost:3000/api
    description: Локальный сервер разработки

tags:
  - name: Authentication
    description: Операции авторизации и аутентификации
  - name: Sections
    description: Управление разделами документации
  - name: Subsections
    description: Управление подразделами внутри раздела
  - name: Pages
    description: Управление страницами документации (внутри подраздела)

paths:
  /auth/login:
    post:
      tags:
        - Authentication
      summary: Авторизация пользователя
      description: Выполняет вход пользователя и возвращает JWT токен
      operationId: login
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
            example:
              username: admin
              password: admin123
      responses:
        '200':
          description: Успешная авторизация
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
              example:
                token: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
                user:
                  id: "1"
                  username: admin
                  role: admin
                  name: Администратор
                success: true
        '401':
          description: Неверное имя пользователя или пароль
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
              example:
                error: Неверное имя пользователя или пароль
                success: false

  /auth/logout:
    post:
      tags:
        - Authentication
      summary: Выход пользователя
      description: Выполняет выход пользователя и инвалидирует токен
      operationId: logout
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Успешный выход
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
              example:
                success: true
                message: Выход выполнен успешно
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /auth/me:
    get:
      tags:
        - Authentication
      summary: Получить данные текущего пользователя
      description: Возвращает информацию о текущем авторизованном пользователе
      operationId: getCurrentUser
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Данные пользователя
          content:
            application/json:
              schema:
                type: object
                properties:
                  user:
                    $ref: '#/components/schemas/User'
                  success:
                    type: boolean
                    example: true
              example:
                user:
                  id: "1"
                  username: admin
                  role: admin
                  name: Администратор
                success: true
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sections:
    get:
      tags:
        - Sections
      summary: Получить все разделы
      description: Возвращает список всех разделов документации
      operationId: getAllSections
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Список разделов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Section'
                  success:
                    type: boolean
                    example: true
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Sections
      summary: Создать новый раздел
      description: Создает новый раздел документации. Требует роль администратора.
      operationId: createSection
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSectionRequest'
            example:
              title: Новый раздел
      responses:
        '200':
          description: Раздел успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Section'
                  success:
                    type: boolean
                    example: true
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sections/{sectionId}:
    get:
      tags:
        - Sections
      summary: Получить раздел по ID
      description: Возвращает информацию о конкретном разделе
      operationId: getSectionById
      security:
        - bearerAuth: []
      parameters:
        - name: sectionId
          in: path
          required: true
          description: ID раздела
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Данные раздела
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Section'
                  success:
                    type: boolean
                    example: true
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Раздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Sections
      summary: Обновить раздел
      description: Обновляет название раздела. Требует роль администратора.
      operationId: updateSection
      security:
        - bearerAuth: []
      parameters:
        - name: sectionId
          in: path
          required: true
          description: ID раздела
          schema:
            type: string
          example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSectionRequest'
            example:
              title: Обновленное название
      responses:
        '200':
          description: Раздел успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Section'
                  success:
                    type: boolean
                    example: true
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Раздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Sections
      summary: Удалить раздел
      description: Удаляет раздел, все его подразделы и страницы. Требует роль администратора.
      operationId: deleteSection
      security:
        - bearerAuth: []
      parameters:
        - name: sectionId
          in: path
          required: true
          description: ID раздела
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Раздел успешно удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Раздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /sections/{sectionId}/subsections:
    get:
      tags:
        - Subsections
      summary: Получить все подразделы раздела
      description: Возвращает список всех подразделов в указанном разделе
      operationId: getSubsectionsBySection
      security:
        - bearerAuth: []
      parameters:
        - name: sectionId
          in: path
          required: true
          description: ID раздела
          schema:
            type: string
          example: "1"
      responses:
        '200':
          description: Список подразделов
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subsection'
                  success:
                    type: boolean
                    example: true
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Раздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Subsections
      summary: Создать новый подраздел
      description: Создает новый подраздел в указанном разделе. Требует роль администратора.
      operationId: createSubsection
      security:
        - bearerAuth: []
      parameters:
        - name: sectionId
          in: path
          required: true
          description: ID раздела
          schema:
            type: string
          example: "1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSubsectionRequest'
            example:
              title: Новый подраздел
      responses:
        '200':
          description: Подраздел успешно создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subsection'
                  success:
                    type: boolean
                    example: true
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Раздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /subsections/{subsectionId}:
    get:
      tags:
        - Subsections
      summary: Получить подраздел по ID
      description: Возвращает информацию о конкретном подразделе
      operationId: getSubsectionById
      security:
        - bearerAuth: []
      parameters:
        - name: subsectionId
          in: path
          required: true
          description: ID подраздела
          schema:
            type: string
          example: "1-1"
      responses:
        '200':
          description: Данные подраздела
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subsection'
                  success:
                    type: boolean
                    example: true
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подраздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    put:
      tags:
        - Subsections
      summary: Обновить подраздел
      description: Обновляет название подраздела. Требует роль администратора.
      operationId: updateSubsection
      security:
        - bearerAuth: []
      parameters:
        - name: subsectionId
          in: path
          required: true
          description: ID подраздела
          schema:
            type: string
          example: "1-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateSubsectionRequest'
            example:
              title: Обновленное название подраздела
      responses:
        '200':
          description: Подраздел успешно обновлен
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Subsection'
                  success:
                    type: boolean
                    example: true
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подраздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Subsections
      summary: Удалить подраздел
      description: Удаляет подраздел и все его страницы. Требует роль администратора.
      operationId: deleteSubsection
      security:
        - bearerAuth: []
      parameters:
        - name: subsectionId
          in: path
          required: true
          description: ID подраздела
          schema:
            type: string
          example: "1-1"
      responses:
        '200':
          description: Подраздел успешно удален
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подраздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /subsections/{subsectionId}/pages:
    get:
      tags:
        - Pages
      summary: Получить все страницы подраздела
      description: Возвращает список всех страниц в указанном подразделе
      operationId: getPagesBySubsection
      security:
        - bearerAuth: []
      parameters:
        - name: subsectionId
          in: path
          required: true
          description: ID подраздела
          schema:
            type: string
          example: "1-1"
      responses:
        '200':
          description: Список страниц
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Page'
                  success:
                    type: boolean
                    example: true
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подраздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    post:
      tags:
        - Pages
      summary: Создать новую страницу
      description: Создает новую страницу в указанном подразделе. Требует роль администратора.
      operationId: createPage
      security:
        - bearerAuth: []
      parameters:
        - name: subsectionId
          in: path
          required: true
          description: ID подраздела
          schema:
            type: string
          example: "1-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePageRequest'
            example:
              title: Новая страница
              content: ""
      responses:
        '200':
          description: Страница успешно создана
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Page'
                  success:
                    type: boolean
                    example: true
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Подраздел не найден
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

  /pages/{pageId}:
    put:
      tags:
        - Pages
      summary: Обновить страницу
      description: Обновляет страницу (название и/или содержимое). Требует роль администратора.
      operationId: updatePage
      security:
        - bearerAuth: []
      parameters:
        - name: pageId
          in: path
          required: true
          description: ID страницы
          schema:
            type: string
          example: "1-1-1"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdatePageRequest'
            example:
              title: Обновленное название
              content: "## Заголовок\n\nОбновленный текст"
      responses:
        '200':
          description: Страница успешно обновлена
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    $ref: '#/components/schemas/Page'
                  success:
                    type: boolean
                    example: true
        '400':
          description: Неверный запрос
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Страница не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

    delete:
      tags:
        - Pages
      summary: Удалить страницу
      description: Удаляет страницу. Требует роль администратора.
      operationId: deletePage
      security:
        - bearerAuth: []
      parameters:
        - name: pageId
          in: path
          required: true
          description: ID страницы
          schema:
            type: string
          example: "1-1-1"
      responses:
        '200':
          description: Страница успешно удалена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SuccessResponse'
        '401':
          description: Не авторизован
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: Доступ запрещен (недостаточно прав)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Страница не найдена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: JWT токен авторизации. Получается через эндпоинт /auth/login

  schemas:
    User:
      type: object
      required:
        - id
        - username
        - role
      properties:
        id:
          type: string
          description: Уникальный идентификатор пользователя
          example: "1"
        username:
          type: string
          description: Имя пользователя
          example: admin
        role:
          type: string
          enum: [admin, client]
          description: Роль пользователя
          example: admin
        name:
          type: string
          description: Отображаемое имя пользователя
          example: Администратор

    LoginRequest:
      type: object
      required:
        - username
        - password
      properties:
        username:
          type: string
          description: Имя пользователя
          example: admin
        password:
          type: string
          format: password
          description: Пароль пользователя
          example: admin123

    LoginResponse:
      type: object
      required:
        - token
        - user
        - success
      properties:
        token:
          type: string
          description: JWT токен для последующих запросов
          example: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9...
        user:
          $ref: '#/components/schemas/User'
        success:
          type: boolean
          example: true

    Section:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Уникальный идентификатор раздела
          example: "1"
        title:
          type: string
          description: Название раздела
          example: Отопление
        subsections:
          type: array
          description: Список подразделов раздела (опционально, может отсутствовать в некоторых ответах)
          items:
            $ref: '#/components/schemas/Subsection'

    CreateSectionRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Название раздела
          minLength: 1
          example: Новый раздел

    UpdateSectionRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Новое название раздела
          minLength: 1
          example: Обновленное название

    Subsection:
      type: object
      required:
        - id
        - title
      properties:
        id:
          type: string
          description: Уникальный идентификатор подраздела
          example: "1-1"
        title:
          type: string
          description: Название подраздела
          example: Котёл и радиаторы
        pages:
          type: array
          description: Список страниц подраздела (опционально, может отсутствовать в некоторых ответах)
          items:
            $ref: '#/components/schemas/Page'

    CreateSubsectionRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Название подраздела
          minLength: 1
          example: Новый подраздел

    UpdateSubsectionRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Новое название подраздела
          minLength: 1
          example: Обновленное название подраздела

    Page:
      type: object
      required:
        - id
        - title
        - content
        - createdAt
        - updatedAt
      properties:
        id:
          type: string
          description: Уникальный идентификатор страницы
          example: "1-1-1"
        title:
          type: string
          description: Название страницы
          example: Общая информация
        content:
          type: string
          description: Содержимое страницы в формате Markdown
          example: "## Заголовок\n\nТекст страницы"
        createdAt:
          type: string
          format: date-time
          description: Дата и время создания (ISO 8601)
          example: "2024-01-15T10:00:00.000Z"
        updatedAt:
          type: string
          format: date-time
          description: Дата и время последнего обновления (ISO 8601)
          example: "2024-01-15T10:00:00.000Z"

    CreatePageRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
          description: Название страницы
          minLength: 1
          example: Новая страница
        content:
          type: string
          description: Содержимое страницы в формате Markdown (опционально, по умолчанию пустое)
          example: ""

    UpdatePageRequest:
      type: object
      properties:
        title:
          type: string
          description: Новое название страницы
          minLength: 1
          example: Обновленное название
        content:
          type: string
          description: Новое содержимое страницы в формате Markdown
          example: "## Заголовок\n\nОбновленный текст"

    SuccessResponse:
      type: object
      required:
        - success
      properties:
        success:
          type: boolean
          example: true
        message:
          type: string
          description: Сообщение об успешном выполнении операции
          example: Выход выполнен успешно

    ErrorResponse:
      type: object
      required:
        - error
        - success
      properties:
        error:
          type: string
          description: Описание ошибки
          example: Неверный запрос
        success:
          type: boolean
          example: false
